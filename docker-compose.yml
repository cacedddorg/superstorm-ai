version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - BYBIT_WSS_URL=wss://stream.bybit.com/v5/public/linear
    restart: always

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_WS_URL=ws://localhost:8000/ws/market
    depends_on:
      - backend
    restart: always
